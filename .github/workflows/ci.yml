name: EduScholar CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Lint & Typecheck
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: January10
          POSTGRES_DB: eduscholar
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            frontend/package.json
            backend/package.json

      # Backend Check
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Database Migration & Reset
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:January10@localhost:5432/eduscholar
        run: npm run reset-db

      - name: Verify Backend Server & Syntax
        working-directory: ./backend
        run: node -e "require('./index.js'); process.exit(0);" || true

      # Frontend Check
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: TypeScript Compilation & Vite Production Build
        working-directory: ./frontend
        run: npm run build
