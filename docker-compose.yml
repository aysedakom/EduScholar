services:
  # -------------------------------------------------------------
  # 1. PostgreSQL Database
  # -------------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    container_name: eduscholar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: January10
      POSTGRES_DB: eduscholar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/db/triggers.sql:/docker-entrypoint-initdb.d/02-triggers.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eduscholar"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eduscholar-net

  # -------------------------------------------------------------
  # 2. Backend (Express REST API, WebSockets, OpenAPI, MCP)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eduscholar-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:January10@postgres:5432/eduscholar
      JWT_SECRET: eduscholar_secure_production_secret_key_2026
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      # API Routing
      - "traefik.http.routers.backend-api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.backend-api.entrypoints=web"
      - "traefik.http.services.backend-api.loadbalancer.server.port=5000"
      # WebSocket Routing
      - "traefik.http.routers.backend-ws.rule=PathPrefix(`/ws`)"
      - "traefik.http.routers.backend-ws.entrypoints=web"
      - "traefik.http.services.backend-ws.loadbalancer.server.port=5000"
      # Swagger API Docs Routing
      - "traefik.http.routers.backend-docs.rule=PathPrefix(`/api-docs`)"
      - "traefik.http.routers.backend-docs.entrypoints=web"
      - "traefik.http.services.backend-docs.loadbalancer.server.port=5000"
    networks:
      - eduscholar-net

  # -------------------------------------------------------------
  # 3. Frontend (Vite SPA + Nginx)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eduscholar-frontend
    restart: unless-stopped
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      # SPA Routing (Root and all other paths)
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    networks:
      - eduscholar-net

  # -------------------------------------------------------------
  # 4. Traefik Reverse Proxy & Gateway
  # -------------------------------------------------------------
  traefik:
    image: traefik:v3.0
    container_name: eduscholar-traefik
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entryPoints.web.address=:80"
    ports:
      - "80:80"        # Public Web Entrypoint (Frontend, API, WS)
      - "8080:8080"    # Traefik Web Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - backend
      - frontend
    networks:
      - eduscholar-net

volumes:
  pgdata:
    driver: local

networks:
  eduscholar-net:
    driver: bridge
